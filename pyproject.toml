[project]
name = "vertisystem-applied-ai-task2"
version = "0.1.0"
description = "Vertisystem Applied AI take-home Task 2: FastAPI abacus microservice with cross-node consistency."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=9.0,<10.0",
]

[project.scripts]
applied-ai-abacus = "applied_ai_abacus.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["applied_ai_abacus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
